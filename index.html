<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Step · prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1F1D;--muted:#4A504B;--line:#DCDED9;--line2:#C9CCC6;--bg:#F4F5F3;--card:#FFFFFF;--acc:#0F6E6A;--accDark:#0B4D4A;--accTint:#E8F4F3;--accLine:#B9DAD7;--warnBg:#FDF3EA;--warnLine:#F0CFAE;--warnInk:#5E2C05;--warnHead:#8A3F06}
*{box-sizing:border-box}
html,body{margin:0;background:#E7E9E5;color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#FFFFFF;border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line2);border-radius:22px;overflow:hidden}
.seg button{min-height:40px;padding:0 16px;border:none;background:#FFFFFF;font-size:14px}
.seg button.on{background:var(--acc);color:#FFFFFF;font-weight:600}
.pill-btn{min-height:40px;min-width:56px;border:1px solid var(--line2);border-radius:20px;background:#FFFFFF;font-size:14px;font-weight:500}
.stage{display:flex;justify-content:center;padding:24px 12px 40px}
.phone{width:390px;height:844px;border-radius:36px;border:10px solid #1F2321;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.18)}
@media (max-width:520px){.stage{padding:0}.phone{width:100%;height:calc(100dvh - 61px);border:none;border-radius:0;box-shadow:none}}
.ahead{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#FFFFFF;border-bottom:1px solid var(--line)}
.ahead .side{width:90px;display:flex}
.ahead .side.end{justify-content:flex-end}
.back{min-height:44px;display:flex;align-items:center;gap:4px;border:none;background:transparent;font-size:15px;padding:0 4px}
[dir=rtl] .back svg{transform:scaleX(-1)}
.screen{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;font-weight:600}
h2{margin:0;font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted);font-size:14px;line-height:1.5}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.okbox{border:1px solid var(--accLine);background:var(--accTint);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--accDark)}
.warnbox{border:1px solid var(--warnLine);background:var(--warnBg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--warnInk)}
.warnbox .head{color:var(--warnHead);font-weight:600;font-size:16px}
.okbox .head{font-weight:600;font-size:16px}
.primary{width:100%;min-height:50px;border:none;border-radius:12px;background:var(--acc);color:#FFFFFF;font-size:16px;font-weight:600}
.primary:disabled{background:#C9CCC6;color:var(--muted);cursor:not-allowed}
.secondary{width:100%;min-height:48px;border:1px solid var(--line2);border-radius:12px;background:#FFFFFF;font-size:15px}
.demo{width:100%;min-height:46px;border:1.5px dashed #7E837D;border-radius:12px;background:transparent;color:#3F4540;font-size:14px}
.opt{text-align:start;width:100%;min-height:56px;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:#FFFFFF}
.opt.on{border:2px solid var(--acc);background:var(--accTint)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap}
.tag.new{background:#E3F1F0;color:#0B5552}.tag.changed{background:#E9ECF3;color:#2E3B56}.tag.stop{background:#FBE6D4;color:#7A3705}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;white-space:nowrap}
.st.needs{background:var(--acc);color:#FFFFFF}.st.wait{background:#ECEDEA;color:#3F4540}.st.done{background:#E3F1F0;color:#0B5552}.st.call{background:#FBE6D4;color:#7A3705}.st.track{background:#E3F1F0;color:#0B5552}
.bar{height:10px;background:#E3E5E0;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
.field{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid #ECEDEA}
.field span:first-child{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:13px}
.trackbtn{text-align:start;border:1px solid var(--line);border-radius:14px;background:#FFFFFF;padding:16px;display:flex;flex-direction:column;gap:10px}
.docbtn{text-align:start;border:1px solid var(--line);border-radius:14px;background:#FFFFFF;padding:18px;display:flex;gap:14px;align-items:center}
.docicon{width:44px;height:54px;flex-shrink:0;border:1px solid var(--line2);border-radius:6px;background:var(--bg);display:flex;flex-direction:column;gap:5px;padding:8px 7px}
.docicon i{display:block;height:3px;background:#C9CCC6}.docicon i:first-child{background:#9CA19B}
.scan{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px 32px;background:#1F2321}
.paper{width:236px;height:330px;background:#FBFBF8;border-radius:4px;padding:22px 18px;display:flex;flex-direction:column;gap:9px}
.paper i{display:block;height:5px;background:#CBCEC8}.paper b{display:block;height:7px;background:#8F948E;margin-top:8px}
.spinner{width:64px;height:64px;border-radius:50%;border:5px solid #CFE5E3;border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hosp{max-width:1280px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi b{font-size:30px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line2);background:#FFFFFF;font-size:14px}
.filters button.on{background:var(--acc);border-color:var(--acc);color:#FFFFFF;font-weight:600}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.tablebox{flex:999 1 560px;min-width:0;background:#FFFFFF;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{text-align:start;padding:12px 16px;font-weight:600;font-size:13px;color:var(--muted);background:#F7F8F6}
td{padding:12px 16px;border-top:1px solid #ECEDEA;vertical-align:middle}
tr.sel td{background:#EEF6F5}
.namebtn{border:none;background:transparent;padding:0;font-size:15px;font-weight:600;color:var(--acc);text-decoration:underline;min-height:32px}
.smallbtn{min-height:36px;padding:0 14px;border-radius:10px;font-size:13px;border:1px solid var(--line2);background:#FFFFFF}
.smallbtn.go{border:none;background:var(--acc);color:#FFFFFF;font-weight:600}
.minibar{width:80px;height:8px;background:#E3E5E0;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}.minibar i{display:block;height:100%;background:var(--acc)}
aside{flex:1 1 300px;min-width:0;background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
textarea{font:inherit;font-size:14px;padding:10px;border:1px solid var(--line2);border-radius:10px;resize:vertical;width:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dow{font-size:11px;color:var(--muted);padding:2px 0}
.day{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#FFFFFF;font-size:14px}
.day.on{background:var(--acc);border-color:var(--acc);color:#FFFFFF;font-weight:600}
.day:disabled{background:#F1F2EF;color:#9A9F99;border-color:#ECEDEA;cursor:not-allowed}
.timechip{min-height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:#FFFFFF;font-size:14px}
.timechip.on{background:var(--acc);border-color:var(--acc);color:#FFFFFF;font-weight:600}
.note{max-width:1280px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>

    h+='<section class="warnbox"><h2 style="color:#8A3F06">'+t.secWarn+'</h2>'; d.warning.forEach(function(w){h+='<p style="font-size:14px;line-height:1.5">'+esc(w)+'</p>';}); h+='</section>';
    if(d.hasNurse) h+= S.nurseAsked ? '<div class="okbox" style="font-size:14px">'+t.nurseSent+'</div>' : '<button type="button" class="secondary" data-a="nurse">'+t.askNurse+'</button>';
    h+='<label style="display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;cursor:pointer;padding:4px 0"><input type="checkbox" data-a="consent" '+(S.consent?'checked':'')+' style="width:22px;height:22px;margin:0;accent-color:#0F6E6A;flex-shrink:0"><span>'+t.consent+'</span></label>';
    h+='<button type="button" class="primary" data-a="confirm" '+(S.consent?'':'disabled')+'>'+t.confirm+'</button></div>'; break;
  case "plan":
    h+='<div class="screen"><div style="display:flex;flex-direction:column;gap:8px"><h1>'+t.planTitle+'</h1><p class="muted">'+esc(d.docName)+'</p>'+progress+'</div>';
    if(done===total) h+='<div class="okbox" style="font-size:15px;font-weight:500">'+t.allDone+'</div>';
    [[t.trT17,"t17",k17,t.next[k17]],[t.trRx,"rx",kRx,t.next[kRx]],[d.fuTrack,"fu",kFu,t.next["fu"+kFu]]].forEach(function(tr){
      h+='<button type="button" class="trackbtn" data-a="go" data-v="'+tr[1]+'"><span class="row" style="width:100%;align-items:center"><span style="font-size:16px;font-weight:600">'+esc(tr[0])+'</span>'+pill(t,tr[2])+'</span><span class="muted">'+t.nextLabel+' '+esc(tr[3])+'</span></button>';
    });
    h+='<p class="small muted">'+t.familyNote+'</p></div>'; break;
  case "t17":
    h+='<div class="screen"><p class="small" style="font-weight:500;color:#0F6E6A">'+t.trT17+'</p>';
    if(k17==="letter"){
      h+='<div class="warnbox"><span class="small">'+t.checkTitle+'</span><span class="head">'+esc(d.checkResult)+'</span><span style="font-size:14px;line-height:1.5">'+esc(d.checkBody)+'</span></div>';
      h+='<h1 style="font-size:19px">'+t.letterTitle+'</h1><div class="card"><span class="small muted">'+esc(d.letterTo)+'</span><p style="font-size:14px;line-height:1.6">'+esc(d.letterBody)+'</p><div style="display:flex;flex-wrap:wrap;gap:8px">';
      d.attachments.forEach(function(a){h+='<span class="chip">'+CLIP+esc(a)+'</span>';});
      h+='</div></div><p class="small muted">'+t.approveHint+'</p><button type="button" class="primary" data-a="adv17">'+t.approveSendGP+'</button>';
    } else if(k17==="waitGP"){
      h+='<div class="card"><span style="font-size:18px;font-weight:600">'+t.waitGPTitle+'</span><span class="muted">'+t.waitGPBody+'</span></div><button type="button" class="demo" data-a="adv17">'+t.simGP+'</button>';
    } else if(k17==="approve"){
      h+= d.t17Valid ? '<div class="okbox"><span class="small">'+t.checkTitle+'</span><span class="head">'+esc(d.checkResult)+'</span><span style="font-size:14px;line-height:1.5">'+esc(d.checkBody)+'</span></div>' : '<div class="okbox" style="font-size:15px;font-weight:500">'+t.gpArrived+'</div>';
      h+='<h1 style="font-size:19px">'+t.approveT17Title+'</h1><p class="muted">'+t.approveT17Sub+'</p><div class="card" style="padding:4px 16px;gap:0">';
      d.t17Fields.forEach(function(f){h+='<div class="field"><span>'+esc(f[0])+'</span><span style="font-size:15px">'+esc(f[1])+'</span></div>';});
      h+='</div><button type="button" class="primary" data-a="adv17">'+t.approveT17Btn+'</button>';
    } else if(k17==="waitKupa"){
      h+='<div class="card"><span style="font-size:18px;font-weight:600">'+t.waitKupaTitle+'</span><span class="muted">'+t.waitKupaBody+'</span></div><button type="button" class="demo" data-a="adv17">'+t.simKupa+'</button>';
    } else if(k17==="slots"){
      h+='<h1 style="font-size:19px">'+t.slotsTitle+'</h1><p class="muted">'+esc(d.slotsWhere)+' · '+t.slotsSub+'</p>';
      d.slots.forEach(function(s,i){h+='<button type="button" class="opt'+(S.slot===i?' on':'')+'" data-a="slot" data-v="'+i+'" style="font-size:15px;font-weight:500">'+esc(s)+'</button>';});
      h+='<button type="button" class="primary" data-a="book" '+(S.slot>=0?'':'disabled')+'>'+t.bookBtn+'</button>';
    } else {
      h+='<div class="okbox"><span style="font-size:18px;font-weight:600">'+t.bookedTitle+'</span><span style="font-size:15px">'+esc(d.slotsWhere)+' · '+esc(d.slots[S.slot]||"")+'</span><span style="font-size:14px;line-height:1.5">'+t.bookedBody+'</span></div><button type="button" class="secondary" data-a="go" data-v="plan">'+t.backToPlan+'</button>';
    }
    h+='</div>'; break;
  case "rx":
    h+='<div class="screen"><p class="small" style="font-weight:500;color:#0F6E6A">'+t.trRx+'</p>';
    if(kRx==="req"){
      h+='<div class="warnbox"><span class="small">'+t.rxCheckTitle+'</span><span class="head">'+t.rxYes+'</span><span style="font-size:14px;line-height:1.5">'+esc(d.rxReason)+'</span></div>';
      if(d.stopNote) h+='<div class="card" style="font-size:14px;font-weight:500">'+esc(d.stopNote)+'</div>';
      h+='<h1 style="font-size:19px">'+t.rxReqTitle+'</h1><div class="card" style="font-size:14px;line-height:1.6">'+esc(d.rxReq)+'</div><button type="button" class="primary" data-a="advRx">'+t.approveSendGP+'</button>';
    } else if(kRx==="wait"){
      h+='<div class="card"><span style="font-size:18px;font-weight:600">'+t.rxWaitTitle+'</span><span class="muted">'+t.waitGPBody+'</span></div><button type="button" class="demo" data-a="advRx">'+t.simRx+'</button>';
    } else if(kRx==="order"){
      h+='<h1 style="font-size:19px">'+t.orderTitle+'</h1>';
      h+='<button type="button" class="opt'+(S.delivery==="pickup"?' on':'')+'" data-a="deliv" data-v="pickup"><span style="font-size:16px;font-weight:600">'+t.pickup+'</span><span class="small muted">'+t.pickupSub+'</span></button>';
      h+='<button type="button" class="opt'+(S.delivery==="delivery"?' on':'')+'" data-a="deliv" data-v="delivery"><span style="font-size:16px;font-weight:600">'+t.delivery+'</span><span class="small muted">'+t.deliverySub+'</span></button>';
      h+='<button type="button" class="primary" data-a="advRx">'+t.approveOrder+'</button>';
    } else {
      h+='<div class="okbox"><span style="font-size:18px;font-weight:600">'+t.orderedTitle+'</span><span style="font-size:14px">'+(S.delivery==="pickup"?t.pickup+' · '+t.pickupSub:t.delivery+' · '+t.deliverySub)+'</span></div><h2 style="font-size:16px">'+t.remTitle+'</h2><div class="card" style="padding:4px 16px;gap:0">';
      d.reminders.forEach(function(r){h+='<div class="field" style="font-size:14px">'+esc(r)+'</div>';});
      h+='</div><button type="button" class="secondary" data-a="go" data-v="plan">'+t.backToPlan+'</button>';
    }
    h+='</div>'; break;
  case "fu":
    h+='<div class="screen"><p class="small" style="font-weight:500;color:#0F6E6A">'+esc(d.fuTrack)+'</p>';
    if(kFu==="slots"){
      h+='<h1 style="font-size:19px">'+t.fuTitle+'</h1><p class="muted">'+t.fuSub+'</p>';
      d.fuItems.forEach(function(it,i){
        var cur=fuCurrent(it,i), changed=!!S.fuOverride[i];
        h+='<div class="card" style="gap:4px"><span class="row" style="align-items:center"><span style="font-size:15px;font-weight:600">'+esc(it.name)+'</span>'+(changed?'<span class="tag new">'+t.changedTag+'</span>':'')+'</span><span class="small muted">'+esc(it.when)+'</span><span style="font-size:14px;color:#0F6E6A;font-weight:500">'+esc(fuLabel(it,cur))+'</span>';
        if(it.iso && S.fuEdit!==i) h+='<button type="button" class="smallbtn" data-a="fuEdit" data-v="'+i+'" style="align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>'+t.changeTime+'</button>';
        if(S.fuEdit===i) h+=calendar(it,cur);
        h+='</div>';
      });
      h+='<button type="button" class="primary" data-a="advFu" '+(S.fuEdit>=0?'disabled':'')+'>'+t.approveAll+'</button>';
    } else {
      h+='<div class="okbox" style="font-size:18px;font-weight:600">'+t.fuBookedTitle+'</div>';
      d.fuItems.forEach(function(it,i){h+='<div class="card row" style="flex-direction:row;align-items:center"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">'+esc(it.name)+'</span><span class="small muted">'+esc(fuLabel(it,fuCurrent(it,i)))+'</span></span>'+CHECK+'</div>';});
      h+='<p class="small muted">'+t.bookedBody+'</p><button type="button" class="secondary" data-a="go" data-v="plan">'+t.backToPlan+'</button>';
    }
    h+='</div>'; break;
  }
  var back = S.screen!=="home" ? '<button type="button" class="back" data-a="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>'+t.back+'</span></button>' : '';
  return '<div class="stage"><div class="phone"><div class="ahead"><div class="side">'+back+'</div><div style="font-size:17px;font-weight:600">'+t.appName+'</div><div class="side end"></div></div>'+h+'</div></div>';
}

function hospScreen(){
  var t=T[S.lang], L=S.lang;
  var counts={track:0,call:0,wait:0}; ROWS.forEach(function(r){counts[r.st]++;});
  var stText={track:t.kTrack,call:t.kCall,wait:t.kWait};
  var h='<div class="hosp"><header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px"><div style="display:flex;flex-direction:column;gap:4px"><h1 style="font-size:26px">'+t.hTitle+'</h1><p class="muted">'+t.hSub+'</p></div><span class="st wait">'+t.sample+'</span></header>';
  h+='<div class="kpis">';
  [[t.kFollowed,ROWS.length,"#1C1F1D"],[t.kTrack,counts.track,"#0B5552"],[t.kCall,counts.call,"#8A3F06"],[t.kWait,counts.wait,"#3F4540"]].forEach(function(k){h+='<div class="kpi"><span class="small muted">'+k[0]+'</span><b style="color:'+k[2]+'">'+k[1]+'</b></div>';});
  h+='</div><nav class="filters">';
  [["all",t.fAll+" ("+ROWS.length+")"],["call",t.kCall+" ("+counts.call+")"],["wait",t.kWait+" ("+counts.wait+")"],["track",t.kTrack+" ("+counts.track+")"]].forEach(function(f){h+='<button type="button" data-a="filter" data-v="'+f[0]+'" class="'+(S.hFilter===f[0]?'on':'')+'">'+f[1]+'</button>';});
  h+='</nav><div class="split"><section class="tablebox"><div class="scroll"><table><thead><tr><th>'+t.colPatient+'</th><th>'+t.colDischarged+'</th><th>'+t.colProgress+'</th><th>'+t.colNext+'</th><th>'+t.colStatus+'</th><th>'+t.colAction+'</th></tr></thead><tbody>';
  ROWS.filter(function(r){return S.hFilter==="all"||r.st===S.hFilter;}).forEach(function(r){
    var x=r[L], pct=Math.round(r.done/r.total*100);
    h+='<tr class="'+(r.id===S.hSel?'sel':'')+'"><td><button type="button" class="namebtn" data-a="hsel" data-v="'+r.id+'">'+esc(x[0])+'</button><div class="small muted">'+esc(x[1])+'</div></td><td>'+r.date+'</td><td><span class="minibar"><i style="width:'+pct+'%"></i></span> <span class="small">'+r.done+'/'+r.total+'</span></td><td>'+esc(x[2])+'</td><td><span class="st '+r.st+'">'+stText[r.st]+'</span></td><td><button type="button" class="smallbtn'+(r.st==="call"?' go':'')+'" data-a="hsel" data-v="'+r.id+'">'+(r.st==="call"?t.call:t.view)+'</button></td></tr>';
  });
  var sel=ROWS.filter(function(r){return r.id===S.hSel;})[0]||ROWS[0], s=sel[L];
  h+='</tbody></table></div></section><aside><div class="row" style="align-items:center"><h2 style="font-size:18px">'+esc(s[0])+'</h2><span class="st '+sel.st+'">'+stText[sel.st]+'</span></div><p class="small muted">'+esc(s[1])+' · '+t.dischargedOn+' '+sel.date+'</p>';
  if(s[6]) h+='<div class="warnbox" style="padding:10px 12px;font-size:14px">'+esc(s[6])+'</div>';
  h+='<div>'; [[t.trT17,s[3]],[t.trRx,s[4]],[t.lFu,s[5]]].forEach(function(tr){h+='<div class="field"><span>'+tr[0]+'</span><span style="font-size:14px">'+esc(tr[1])+'</span></div>';}); h+='</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" class="primary" style="flex:1 1 120px;min-height:44px;font-size:14px">'+t.callPatient+'</button><button type="button" class="secondary" style="flex:1 1 120px;min-height:44px;font-size:14px">'+t.messageFamily+'</button></div>';
  h+='<label style="display:flex;flex-direction:column;gap:6px" class="small muted">'+t.notes+'<textarea rows="3" placeholder="'+t.notesPh+'"></textarea></label></aside></div></div>';
  return h;
}

function render(){
  var t=T[S.lang];
  document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==="he"?"rtl":"ltr";
  document.getElementById("tabApp").textContent=t.tabApp; document.getElementById("tabHosp").textContent=t.tabHosp;
  document.getElementById("tabApp").className=S.view==="app"?"on":""; document.getElementById("tabHosp").className=S.view==="hosp"?"on":"";
  document.getElementById("langBtn").textContent=t.toggle; document.getElementById("footnote").textContent=t.foot;
  document.getElementById("root").innerHTML = S.view==="app" ? appScreen() : hospScreen();
}

function set(p){ for(var k in p) S[k]=p[k]; render(); }

document.addEventListener("click", function(e){
  var el=e.target.closest("[data-a]"); if(!el || el.disabled) return;
  var a=el.getAttribute("data-a"), v=el.getAttribute("data-v"), flow=S.flow||"dis";
  if(a==="consent") return;
  if(a==="view") set({view:v});
  else if(a==="lang") set({lang:S.lang==="he"?"en":"he"});
  else if(a==="go") set({screen:v});
  else if(a==="back") set({screen:BACK[S.screen]||"home"});
  else if(a==="start") set({flow:v,screen:"scan",planned:false,nurseAsked:false,t17:0,rx:0,fu:0,slot:-1,delivery:"pickup",consent:true,fuEdit:-1,fuDay:null,fuTime:null,fuOverride:{}});
  else if(a==="fuEdit") set({fuEdit:+v,fuDay:null,fuTime:null});
  else if(a==="fuDay") set({fuDay:v});
  else if(a==="fuTime") set({fuTime:v});
  else if(a==="fuCancel") set({fuEdit:-1,fuDay:null,fuTime:null});
  else if(a==="fuSave"){ var it=data(flow,S.lang).fuItems[S.fuEdit], cur=fuCurrent(it,S.fuEdit), o={}; for(var k in S.fuOverride) o[k]=S.fuOverride[k]; var n={iso:S.fuDay||cur.iso,time:S.fuTime||cur.time}; if(n.iso!==it.iso||n.time!==it.time) o[S.fuEdit]=n; else delete o[S.fuEdit]; set({fuOverride:o,fuEdit:-1,fuDay:null,fuTime:null}); }
  else if(a==="capture"){ set({screen:"reading"}); setTimeout(function(){ if(S.screen==="reading") set({screen:"review"}); },2200); }
  else if(a==="nurse") set({nurseAsked:true});
  else if(a==="confirm"){ if(S.consent) set({planned:true,screen:"plan"}); }
  else if(a==="adv17"){ if(S.t17<K17[flow].length-1) set({t17:S.t17+1}); }
  else if(a==="slot") set({slot:+v});
  else if(a==="book"){ if(S.slot>=0) set({t17:S.t17+1}); }
  else if(a==="advRx"){ if(S.rx<KRX.length-1) set({rx:S.rx+1}); }
  else if(a==="deliv") set({delivery:v});
  else if(a==="advFu"){ if(S.fu<KFU.length-1) set({fu:S.fu+1}); }
  else if(a==="filter") set({hFilter:v});
  else if(a==="hsel") set({hSel:+v});
});
document.addEventListener("change", function(e){ if(e.target.getAttribute("data-a")==="consent") set({consent:e.target.checked}); });
(function(){
  var q=(location.search+location.hash).toLowerCase();
  if(/hosp|hospital/.test(q)) S.view="hosp";
  if(/lang=en|[#&?]en\b/.test(q)) S.lang="en";
})();
render();
</script>
</body>
</html>
